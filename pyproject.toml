[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dialect-fusion-ctg"
version = "1.0.0"
description = "Multi-input late-fusion emotion classification for Chittagonian Bangla dialect"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
